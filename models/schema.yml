version: 2

sources:
  - name: raw
    database: dbt-saizrosamaria
    schema: gz_raw_data
    loader: bigquery
    description: Raw data from Greenweez

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: One row per product sold per order
        columns:
          - name: date_date
            description: Date of the order
          - name: orders_id
            description: Unique identifier of the order
          - name: pdt_id
            description: Unique identifier of the product
          - name: revenue
            description: Revenue generated by the product
          - name: quantity
            description: Quantity of product sold
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: One row per purchase price per product sold
        columns:
          - name: products_id
            description: Unique identifier of the product
            tests:
              - unique
              - not_null
          - name: purchse_price
            description: Price per product

      - name: ship
        identifier: raw_gz_ship
        description: Shipping costs per order
        columns:
          - name: orders_id
            description: Unique identifier of the order
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: Shipping fee per order
          - name: shipping_fee_1
            description: Duplicate column for shipping_fee
          - name: logCost
            description: Logistics costs per order
          - name: ship_cost
            description: Shipping costs per order
